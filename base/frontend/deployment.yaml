apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: tazmans/todo-aws-lab-front:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
